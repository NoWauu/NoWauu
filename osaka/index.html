   if(kk==='del')cur=cur.slice(0,-1);
   else if(kk==='clear')cur='';
   else if(cur.length<10)cur=cur+kk;
   if(keyTarget==='find')findPhone=cur;else S.res.phone=cur;
   updatePhoneUI();break;}

 /* Retrouver / arrivée */
 case 'do-find':{
   if(t.getAttribute('aria-disabled')==='true')break;
   t.classList.add('is-loading');
   setTimeout(function(){
    if(findPhone.charAt(1)==='7'){
     t.classList.remove('is-loading');
     modal({title:'Aucune réservation à ce numéro',sub:'Vérifiez le numéro saisi ou demandez de l’aide à notre équipe.',
      body:'<div class="notice notice-info">'+ic('info')+'<div>Votre réservation a peut-être été enregistrée avec un autre téléphone.</div></div>',
      foot:'<button class="btn btn-secondary grow" data-act="close-layer">Réessayer</button>'
       +'<button class="btn btn-primary grow" data-act="help">'+ic('help')+'Demander de l’aide</button>'});
     return;
    }
    S.lastRes={people:2,when:'later',date:todayISO(),time:'20:00',pref:'salle',
     name:'Teo',phone:findPhone,sms:true,code:'#A472'};
    S.route='res-found';render();
   },900);break;}
 case 'arrive':{
   S.route='arrival-ok';render();
   setTimeout(function(){if(S.route==='arrival-ok')privacyReset();},6500);break;}
 case 'privacy-reset':privacyReset();break;
 case 'privacy-stay':clearInterval(countdownTimer);closeTop();armPrivacy();break;

 /* Liste d’attente */
 case 'wl-people':WL.people=+t.getAttribute('data-n');render();break;
 case 'wl-join':{
   var n1=$('#wlName'),p1=$('#wlPhone');
   WL.name=n1?n1.value:'';WL.phone=p1?p1.value:'';
   if(WL.name.trim().length<2||WL.phone.replace(/\D/g,'').length<10){
    toast('Merci d’indiquer votre nom et votre téléphone','err');break;}
   S.waitlist={pos:3,eta:20,people:WL.people,name:WL.name};
   S.route='waitlist-joined';render();break;}
 case 'wl-leave':
   modal({title:'Quitter la liste d’attente ?',sub:'Vous perdrez votre position actuelle.',
    foot:'<button class="btn btn-secondary grow" data-act="close-layer">Rester</button>'
     +'<button class="btn btn-danger grow" data-act="wl-leave-yes">Quitter</button>'});
   break;
 case 'wl-leave-yes':closeAllLayers();toast('Vous avez quitté la liste d’attente');privacyReset();break;

 /* Aide */
 case 'help-call':closeTop();confirmHelp(t.getAttribute('data-k'));break;
 case 'help-confirm':closeAllLayers();toast('Un membre de l’équipe arrive à la table '+S.table);break;

 /* Démo */
 case 'demo':runDemo(t.getAttribute('data-k'));break;
 case 'demo-open':closeAllLayers();openDemo();break;
 }
});

/* Saisies */
document.addEventListener('input',function(e){
 var el=e.target;
 if(el.id==='q'){
  S.query=el.value;
  refreshCatalog();
  var title=$('.catalog-title-row .t-h2'),eye=$('.catalog-title-row .t-eyebrow'),cnt=$('.catalog-title-row .t-sm');
  var n=filteredProducts().length;
  if(title)title.textContent=S.query?'« '+S.query+' »':catName(S.cat);
  if(eye)eye.textContent=S.query?'Recherche':'Catégorie';
  if(cnt)cnt.textContent=n+' plat'+(n>1?'s':'');
  var clr=$('.s-clear');if(clr)clr.classList.toggle('hide',!S.query);
  $$('.cat').forEach(function(c){c.setAttribute('aria-selected',!S.query&&c.getAttribute('data-id')===S.cat);});
 }
 else if(el.id==='orderNote'){S.orderNote=el.value;}
 else if(el.id==='pdNote'&&PD){PD.note=el.value;}
 else if(el.id==='resName'&&S.res){S.res.name=el.value;
  var srow=$('.side-row[data-side="Au nom de"]');
  if(srow){srow.classList.toggle('is-todo',!el.value.trim());
   srow.querySelector('.sr-v').textContent=el.value.trim()||'À choisir';}
  var b=$('[data-act="res-next"]');
  if(b)b.setAttribute('aria-disabled',(S.res.name.trim().length>1&&S.res.phone.length>=10)?'false':'true');}
 else if(el.id==='wlName'){WL.name=el.value;}
 else if(el.id==='wlPhone'){WL.phone=el.value;}
});

/* Toute interaction repousse le délai de confidentialité */
document.addEventListener('pointerdown',function(){if(!$('#stillThere'))armPrivacy();});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&$('#layers').lastElementChild&&!$('#stillThere'))closeTop();
});

/* ---------- INIT ---------- */
render();

})();
</script>
