<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Osaka Tablette</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Refonte UX/UI complète de l'application tablette du Restaurant Osaka — commande à table, réservation, liste d'attente et design system.">
<style>
/* ==========================================================================
   OSAKA — DESIGN SYSTEM
   Tokens → Primitives → Composants → Écrans
   Tablette paysage 10–13", tactile, cible 48–56 px minimum.
   ========================================================================== */

/* ---------- 1. TOKENS ---------- */
:root{
  /* Couleurs de fond */
  --paper:#FCFAF6;         /* blanc cassé, fond général */
  --cream:#F4EEE4;         /* crème, surfaces secondaires */
  --sand:#EBE1D2;          /* beige */
  --wood:#DCC7AB;          /* bois clair */
  --surface:#FFFFFF;

  /* Encres */
  --ink:#191A1C;           /* noir doux, titres */
  --ink-2:#33353A;         /* anthracite, corps */
  --muted:#6B6E76;         /* infos secondaires */
  --faint:#9A9CA3;         /* placeholder */
  --line:#E7DFD3;          /* filets */
  --line-strong:#D8CDBC;

  /* Accent — rouge Osaka */
  --osaka:#C0362D;
  --osaka-deep:#96241D;
  --osaka-ink:#7A1C16;
  --osaka-soft:#FBEDEB;
  --osaka-tint:#F6DDD9;

  /* Sémantique */
  --ok:#2E7D57;
  --ok-soft:#E6F2EC;
  --warn:#A97213;
  --warn-soft:#FBF0DC;
  --danger:#B3261E;
  --danger-soft:#FBEAE8;
  --info-soft:#EDF1F6;

  /* Rayons */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-2xl:36px; --r-pill:999px;

  /* Espacements (base 4) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --s7:32px; --s8:40px; --s9:48px; --s10:64px; --s11:80px;

  /* Ombres — teintées chaud, jamais grises */
  --sh-1:0 1px 2px rgba(60,44,28,.05), 0 2px 6px rgba(60,44,28,.05);
  --sh-2:0 2px 6px rgba(60,44,28,.06), 0 10px 24px rgba(60,44,28,.07);
  --sh-3:0 6px 14px rgba(60,44,28,.08), 0 22px 48px rgba(60,44,28,.11);
  --sh-4:0 12px 30px rgba(60,44,28,.12), 0 42px 90px rgba(45,32,20,.20);
  --sh-red:0 6px 16px rgba(192,54,45,.24), 0 2px 4px rgba(192,54,45,.18);

  /* Typographie */
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",system-ui,"Noto Sans",sans-serif;
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;

  /* Cibles tactiles */
  --tap:56px; --tap-sm:48px;

  /* Mouvement — court, jamais spectaculaire */
  --t-fast:120ms; --t:180ms; --t-slow:280ms;
  --ease:cubic-bezier(.2,.7,.3,1);

  /* Gabarit */
  --topbar:78px;
  --col-cat:236px;
  --col-cart:378px;
}

/* ---------- 2. RESET / BASE ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font);
  font-size:16px;
  line-height:1.45;
  color:var(--ink-2);
  background:
    radial-gradient(1200px 700px at 15% -10%, #F1E7D8 0%, rgba(241,231,216,0) 60%),
    radial-gradient(900px 600px at 110% 110%, #EFE3D2 0%, rgba(239,227,210,0) 55%),
    #E9E0D2;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
h1,h2,h3,h4,p,figure{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus{outline:none}
:focus-visible{outline:3px solid var(--osaka);outline-offset:3px;border-radius:6px}
::selection{background:var(--osaka-tint)}

/* Barres de défilement discrètes */
.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.scroll::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
.scroll::-webkit-scrollbar-track{background:transparent}

/* ---------- 3. TYPOGRAPHIE ---------- */
.t-display{font-family:var(--font-display);font-size:56px;line-height:1.04;letter-spacing:-.015em;color:var(--ink);font-weight:600}
.t-h1{font-family:var(--font-display);font-size:38px;line-height:1.1;letter-spacing:-.01em;color:var(--ink);font-weight:600}
.t-h2{font-size:27px;line-height:1.2;letter-spacing:-.01em;color:var(--ink);font-weight:700}
.t-h3{font-size:21px;line-height:1.25;color:var(--ink);font-weight:700}
.t-lead{font-size:19px;line-height:1.5;color:var(--muted)}
.t-body{font-size:16px;line-height:1.5}
.t-sm{font-size:14.5px;line-height:1.45;color:var(--muted)}
.t-eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.t-price{font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.center{text-align:center}
.mute{color:var(--muted)}

/* Marque */
.wordmark{font-family:var(--font-display);font-weight:600;letter-spacing:.22em;text-transform:uppercase}

/* ---------- 4. APP SHELL ---------- */
#device{
  position:fixed;inset:0;margin:auto;
  width:100%;max-width:1512px;height:100%;max-height:952px;
  background:var(--paper);
  border-radius:26px;
  box-shadow:var(--sh-4);
  overflow:hidden;
  display:flex;flex-direction:column;
  isolation:isolate;
}
@media (max-width:1000px),(max-height:760px){
  #device{border-radius:0;max-width:none;max-height:none;box-shadow:none}
}
#screen{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

/* Motif noren très léger, utilisé en fond de certaines zones */
.noren-lines{
  background-image:repeating-linear-gradient(90deg,rgba(25,26,28,.045) 0 1px,transparent 1px 34px);
}
.seigaiha{
  background-image:radial-gradient(circle at 50% 100%, transparent 12px, rgba(25,26,28,.035) 12px 13px, transparent 13px);
  background-size:40px 20px;
}

/* ---------- 5. TOPBAR ---------- */
.topbar{
  height:var(--topbar);flex:0 0 var(--topbar);
  display:flex;align-items:center;gap:var(--s5);
  padding:0 var(--s6);
  background:rgba(252,250,246,.92);
  backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line);
  position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.brand-sun{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 34% 32%, #D8483F 0%, var(--osaka) 55%, var(--osaka-deep) 100%);
  box-shadow:0 2px 8px rgba(192,54,45,.35);
  flex:0 0 auto;
}
.brand-txt{display:flex;flex-direction:column;line-height:1}
.brand-txt b{font-family:var(--font-display);font-size:21px;letter-spacing:.2em;color:var(--ink);font-weight:600}
.brand-txt span{font-size:11px;letter-spacing:.1em;color:var(--muted);margin-top:3px}

/* Navigation principale — segmentée, très tactile */
.nav{display:flex;gap:6px;background:var(--cream);padding:5px;border-radius:var(--r-pill);margin:0 auto}
.nav-item{
  height:52px;min-width:120px;padding:0 var(--s5);
  display:flex;align-items:center;justify-content:center;gap:9px;
  border-radius:var(--r-pill);font-size:16px;font-weight:600;color:var(--ink-2);
  transition:background var(--t) var(--ease),color var(--t) var(--ease),transform var(--t-fast) var(--ease);
  position:relative;white-space:nowrap;
}
.nav-item svg{width:21px;height:21px;flex:0 0 auto}
@media (hover:hover){.nav-item:hover{background:rgba(255,255,255,.72)}}
.nav-item:active{transform:scale(.97)}
.nav-item[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);font-weight:700}
.nav-item[aria-current="true"]::after{
  content:"";position:absolute;bottom:7px;left:50%;transform:translateX(-50%);
  width:20px;height:3px;border-radius:2px;background:var(--osaka);
}
.nav-dot{
  min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--osaka);color:#fff;
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;
}

.topbar-right{display:flex;align-items:center;gap:var(--s3);flex:0 0 auto}

/* Numéro de table — élément d'identité fort */
.table-badge{
  display:flex;align-items:center;gap:11px;height:52px;padding:0 var(--s5) 0 12px;
  background:var(--ink);color:#fff;border-radius:var(--r-pill);box-shadow:var(--sh-2);
}
.table-badge .tb-num{
  width:34px;height:34px;border-radius:50%;background:var(--osaka);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
}
.table-badge .tb-lbl{display:flex;flex-direction:column;line-height:1.1}
.table-badge .tb-lbl small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.62}
.table-badge .tb-lbl b{font-size:16px;font-weight:700}

/* ---------- 6. BOUTONS ---------- */
.btn{
  --btn-h:var(--tap);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  height:var(--btn-h);min-height:var(--btn-h);padding:0 var(--s6);
  border-radius:var(--r-pill);font-size:17px;font-weight:700;letter-spacing:.005em;
  transition:transform var(--t-fast) var(--ease),box-shadow var(--t) var(--ease),
             background var(--t) var(--ease),color var(--t) var(--ease),opacity var(--t) var(--ease);
  position:relative;overflow:hidden;user-select:none;white-space:nowrap;
}
.btn svg{width:22px;height:22px;flex:0 0 auto}
.btn:active{transform:scale(.975)}
.btn[disabled],.btn[aria-disabled="true"]{pointer-events:none;opacity:.45}
.btn.is-loading{color:transparent!important;pointer-events:none}
.btn.is-loading::after{
  content:"";position:absolute;inset:0;margin:auto;width:22px;height:22px;border-radius:50%;
  border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;
}
.btn-secondary.is-loading::after,.btn-tertiary.is-loading::after{border-color:rgba(25,26,28,.2);border-top-color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Primaire — l'action que le client veut faire maintenant */
.btn-primary{background:var(--osaka);color:#fff;box-shadow:var(--sh-red)}
@media (hover:hover){.btn-primary:hover{background:var(--osaka-deep)}}
.btn-primary:active{background:var(--osaka-deep);box-shadow:0 2px 6px rgba(192,54,45,.3)}
/* Secondaire */
.btn-secondary{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-strong),var(--sh-1)}
@media (hover:hover){.btn-secondary:hover{background:var(--cream)}}
.btn-secondary:active{background:var(--sand)}
/* Tertiaire */
.btn-tertiary{background:transparent;color:var(--ink-2);font-weight:600}
@media (hover:hover){.btn-tertiary:hover{background:rgba(25,26,28,.055)}}
.btn-tertiary:active{background:rgba(25,26,28,.09)}
/* Sombre & danger */
.btn-dark{background:var(--ink);color:#fff;box-shadow:var(--sh-2)}
.btn-dark:active{background:#000}
.btn-danger{background:var(--danger-soft);color:var(--danger);box-shadow:inset 0 0 0 1.5px rgba(179,38,30,.22)}
@media (hover:hover){.btn-danger:hover{background:#F7DCD9}}
/* Tailles */
.btn-lg{--btn-h:68px;font-size:19px;padding:0 var(--s7)}
.btn-xl{--btn-h:78px;font-size:21px;padding:0 var(--s8)}
.btn-sm{--btn-h:var(--tap-sm);font-size:15.5px;padding:0 var(--s5)}
.btn-block{display:flex;width:100%}
.btn-split{justify-content:space-between;gap:var(--s3)}
.btn{max-width:100%}
.pd-foot .btn{padding:0 var(--s5)}

/* Bouton iconographique — jamais en dessous de 48 px */
.icon-btn{
  width:var(--tap);height:var(--tap);border-radius:var(--r-pill);
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-strong),var(--sh-1);
  transition:background var(--t) var(--ease),transform var(--t-fast) var(--ease);
}
.icon-btn svg{width:24px;height:24px}
@media (hover:hover){.icon-btn:hover{background:var(--cream)}}
.icon-btn:active{transform:scale(.94);background:var(--sand)}
.icon-btn-ghost{background:transparent;box-shadow:none}
@media (hover:hover){.icon-btn-ghost:hover{background:rgba(25,26,28,.06)}}
.icon-btn-sm{width:var(--tap-sm);height:var(--tap-sm)}
.icon-btn-sm svg{width:21px;height:21px}

/* ---------- 7. BADGES / CHIPS ---------- */
.badge{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-pill);
  font-size:13px;font-weight:700;letter-spacing:.01em;background:var(--cream);color:var(--ink-2);white-space:nowrap;
}
.badge svg{width:15px;height:15px}
.badge-pop{background:var(--osaka);color:#fff}
.badge-new{background:var(--ink);color:#fff}
.badge-spicy{background:var(--danger-soft);color:var(--danger)}
.badge-veg{background:var(--ok-soft);color:var(--ok)}
.badge-chef{background:#F0E6D2;color:#7A5A16}
.badge-gf{background:var(--info-soft);color:#3A5474}
.badge-out{background:rgba(25,26,28,.82);color:#fff}

.chip{
  display:inline-flex;align-items:center;gap:8px;height:var(--tap-sm);padding:0 var(--s5);
  border-radius:var(--r-pill);background:var(--surface);color:var(--ink-2);font-size:15.5px;font-weight:600;
  box-shadow:inset 0 0 0 1.5px var(--line);transition:all var(--t) var(--ease);white-space:nowrap;
}
@media (hover:hover){.chip:hover{box-shadow:inset 0 0 0 1.5px var(--line-strong);background:var(--cream)}}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"],.chip.is-selected{background:var(--ink);color:#fff;box-shadow:none;font-weight:700}
.chip-allergen{background:var(--cream);box-shadow:none;height:40px;font-size:15px;color:var(--ink-2)}

/* ---------- 8. CARTES ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.card-pad{padding:var(--s6)}
.panel{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-2)}

/* ---------- 9. CHAMPS ---------- */
.field{display:block}
.field-label{display:block;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:9px}
.field-hint{font-size:14px;color:var(--muted);margin-top:8px}
.input,.textarea{
  width:100%;min-height:var(--tap);padding:15px var(--s5);
  background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--r-md);
  font-size:17px;color:var(--ink);transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease);
}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
.input:focus,.textarea:focus{border-color:var(--osaka);box-shadow:0 0 0 4px var(--osaka-soft)}
.textarea{min-height:104px;resize:none;line-height:1.5}
.input-lg{min-height:68px;font-size:23px;font-weight:600;letter-spacing:.04em}
.field.has-error .input,.field.has-error .textarea{border-color:var(--danger);box-shadow:0 0 0 4px var(--danger-soft)}
.err-msg{display:flex;align-items:center;gap:8px;margin-top:9px;color:var(--danger);font-size:14.5px;font-weight:600}
.err-msg svg{width:18px;height:18px;flex:0 0 auto}

/* Recherche */
.search{position:relative;flex:1;min-width:0}
.search .s-ico{position:absolute;left:19px;top:50%;transform:translateY(-50%);display:flex;color:var(--muted);pointer-events:none}
.search .s-ico svg{width:22px;height:22px}
.search input{
  width:100%;height:var(--tap);padding:0 52px 0 52px;border-radius:var(--r-pill);
  background:var(--surface);border:1.5px solid var(--line);font-size:16.5px;
  transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease);
}
.search input:focus{border-color:var(--osaka);box-shadow:0 0 0 4px var(--osaka-soft)}
.search .s-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%)}

/* Interrupteur */
.switch{display:flex;align-items:center;gap:14px;min-height:var(--tap);cursor:pointer;user-select:none}
.switch-track{
  width:62px;height:36px;border-radius:99px;background:var(--line-strong);position:relative;flex:0 0 auto;
  transition:background var(--t) var(--ease);
}
.switch-track::after{
  content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#fff;
  box-shadow:var(--sh-1);transition:transform var(--t) var(--ease);
}
.switch[aria-checked="true"] .switch-track{background:var(--ok)}
.switch[aria-checked="true"] .switch-track::after{transform:translateX(26px)}

/* ---------- 10. SÉLECTEUR DE QUANTITÉ (tactile, jamais minuscule) ---------- */
.qty{
  display:inline-flex;align-items:center;background:var(--cream);border-radius:var(--r-pill);
  padding:4px;box-shadow:inset 0 0 0 1.5px var(--line);
}
.qty button{
  width:52px;height:52px;border-radius:50%;background:var(--surface);color:var(--ink);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-1);
  transition:transform var(--t-fast) var(--ease),background var(--t) var(--ease),color var(--t) var(--ease);
}
.qty button svg{width:22px;height:22px}
@media (hover:hover){.qty button:hover{background:var(--ink);color:#fff}}
.qty button:active{transform:scale(.9)}
.qty button[disabled]{opacity:.35;pointer-events:none}
.qty .q-val{min-width:56px;text-align:center;font-size:21px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.qty-lg button{width:60px;height:60px}
.qty-lg .q-val{min-width:64px;font-size:24px}
.qty-sm button{width:46px;height:46px}
.qty-sm .q-val{min-width:46px;font-size:19px}
.q-bump{animation:qbump .26s var(--ease)}
@keyframes qbump{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}

/* Bouton de suppression — discret mais atteignable */
.qty .q-trash{color:var(--danger)}
@media (hover:hover){.qty .q-trash:hover{background:var(--danger);color:#fff}}

/* ---------- 11. STEPPER / PROGRESSION ---------- */
.stepper{display:flex;align-items:center;gap:10px}
.step{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.step-bullet{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--cream);color:var(--muted);font-size:14.5px;font-weight:800;flex:0 0 auto;
  box-shadow:inset 0 0 0 1.5px var(--line-strong);transition:all var(--t) var(--ease);
}
.step-lbl{font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap}
.step.is-done .step-bullet{background:var(--ok);color:#fff;box-shadow:none}
.step.is-current .step-bullet{background:var(--osaka);color:#fff;box-shadow:0 0 0 5px var(--osaka-soft)}
.step.is-current .step-lbl{color:var(--ink);font-weight:700}
.step-sep{width:26px;height:2px;border-radius:2px;background:var(--line-strong);flex:0 0 auto}
.step.is-done+.step-sep{background:var(--ok)}
@media (max-width:1080px){.step-lbl{display:none}.step-sep{width:18px}}

.progress{height:6px;border-radius:99px;background:var(--sand);overflow:hidden}
.progress i{display:block;height:100%;background:var(--osaka);border-radius:99px;transition:width var(--t-slow) var(--ease)}

/* ---------- 12. MODALES / TIROIRS / BOTTOM SHEETS ---------- */
.overlay{
  position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(30,22,14,.42);backdrop-filter:blur(3px);
  animation:fade var(--t) var(--ease);padding:var(--s6);
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.overlay.is-closing{animation:fadeout var(--t) var(--ease) forwards}
@keyframes fadeout{to{opacity:0}}

.modal{
  background:var(--paper);border-radius:var(--r-2xl);box-shadow:var(--sh-4);
  width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;
  animation:pop var(--t-slow) var(--ease);
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal-wide{width:min(1040px,100%)}
.modal-head{display:flex;align-items:center;gap:var(--s4);padding:var(--s6) var(--s6) var(--s4)}
.modal-body{padding:0 var(--s6) var(--s6);overflow-y:auto}
.modal-foot{padding:var(--s5) var(--s6);border-top:1px solid var(--line);background:var(--surface);display:flex;gap:var(--s3)}

/* Tiroir droit (fiche produit sur tablette paysage) */
.drawer-wrap{position:absolute;inset:0;z-index:60;display:flex;justify-content:flex-end;background:rgba(30,22,14,.42);backdrop-filter:blur(3px);animation:fade var(--t) var(--ease)}
.drawer{
  width:min(600px,94%);height:100%;background:var(--paper);box-shadow:var(--sh-4);
  display:flex;flex-direction:column;animation:slidein var(--t-slow) var(--ease);
}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}

/* Bottom sheet (portrait / actions rapides) */
.sheet-wrap{position:absolute;inset:0;z-index:70;display:flex;align-items:flex-end;background:rgba(30,22,14,.42);backdrop-filter:blur(3px);animation:fade var(--t) var(--ease)}
.sheet{
  width:100%;background:var(--paper);border-radius:var(--r-2xl) var(--r-2xl) 0 0;box-shadow:var(--sh-4);
  max-height:88%;display:flex;flex-direction:column;animation:sheetup var(--t-slow) var(--ease);padding-bottom:var(--s4);
}
@keyframes sheetup{from{transform:translateY(60px)}to{transform:none}}
.sheet-grab{width:52px;height:5px;border-radius:99px;background:var(--line-strong);margin:12px auto 4px}

/* ---------- 13. TOASTS ---------- */
#toasts{position:absolute;left:0;right:0;bottom:26px;z-index:90;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:13px;padding:15px var(--s6);border-radius:var(--r-pill);
  background:var(--ink);color:#fff;box-shadow:var(--sh-3);font-size:16px;font-weight:600;
  animation:toastin var(--t-slow) var(--ease);max-width:90%;
}
.toast svg{width:22px;height:22px;flex:0 0 auto}
.toast.is-out{animation:toastout var(--t) var(--ease) forwards}
.toast-ok svg{color:#7BD8A8}
.toast-err{background:var(--danger)}
@keyframes toastin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(10px)}}

/* ---------- 14. SKELETONS & CHARGEMENT ---------- */
.sk{background:linear-gradient(100deg,var(--cream) 30%,#FBF6EE 50%,var(--cream) 70%);background-size:220% 100%;animation:shimmer 1.3s infinite linear;border-radius:var(--r-sm)}
@keyframes shimmer{to{background-position:-220% 0}}
.sk-card{border-radius:var(--r-lg);overflow:hidden;background:var(--surface);box-shadow:var(--sh-1)}
.sk-img{aspect-ratio:4/3;width:100%}
.sk-line{height:14px;border-radius:99px}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line-strong);border-top-color:var(--osaka);animation:spin .7s linear infinite}

/* ---------- 15. ÉTATS VIDES / ERREURS ---------- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--s8) var(--s6);gap:var(--s4);height:100%}
.empty-ill{width:112px;height:112px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--osaka);box-shadow:inset 0 0 0 1.5px var(--line)}
.empty-ill svg{width:50px;height:50px}
.notice{display:flex;gap:14px;padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--warn-soft);color:#6E4A0C;font-size:15px;line-height:1.45}
.notice svg{width:22px;height:22px;flex:0 0 auto;color:var(--warn)}
.notice-info{background:var(--info-soft);color:#33455E}
.notice-info svg{color:#4A6690}
.notice-danger{background:var(--danger-soft);color:#7C1E18}
.notice-danger svg{color:var(--danger)}

/* ---------- 16. ÉCRAN CARTE — 3 zones paysage ---------- */
.menu-layout{flex:1;min-height:0;display:grid;grid-template-columns:var(--col-cat) minmax(0,1fr) var(--col-cart)}

/* Colonne catégories */
.cats{
  border-right:1px solid var(--line);background:var(--cream);
  display:flex;flex-direction:column;min-height:0;
}
.cats-head{padding:var(--s5) var(--s5) var(--s3)}
.cats-list{flex:1;min-height:0;padding:0 var(--s3) var(--s4);display:flex;flex-direction:column;gap:5px}
.cat{
  display:flex;align-items:center;gap:11px;min-height:56px;padding:8px 12px;border-radius:var(--r-md);
  color:var(--ink-2);font-size:15.5px;font-weight:600;text-align:left;position:relative;
  transition:background var(--t) var(--ease),color var(--t) var(--ease),transform var(--t-fast) var(--ease);
}
.cat-ico{width:36px;height:36px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:var(--sh-1);transition:all var(--t) var(--ease)}
.cat-ico svg{width:21px;height:21px;color:var(--ink-2)}
.cat-n{flex:1;min-width:0;line-height:1.2;overflow-wrap:break-word}
.cat-count{font-size:13.5px;color:var(--faint);font-weight:700}
@media (hover:hover){.cat:hover{background:rgba(255,255,255,.72)}}
.cat:active{transform:scale(.985)}
.cat[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:var(--sh-2)}
.cat[aria-selected="true"] .cat-ico{background:var(--osaka)}
.cat[aria-selected="true"] .cat-ico svg{color:#fff}
.cat[aria-selected="true"] .cat-count{color:rgba(255,255,255,.55)}

/* Zone catalogue */
.catalog{display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.catalog-head{padding:var(--s5) var(--s6) var(--s4);display:flex;flex-direction:column;gap:var(--s4);border-bottom:1px solid var(--line)}
.catalog-title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s5)}
.catalog-tools{display:flex;gap:var(--s3);align-items:center}
.catalog-body{flex:1;min-height:0;padding:var(--s6)}
.grid-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:var(--s4)}


/* Carte produit */
.p-card{
  background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden;
  display:flex;flex-direction:column;text-align:left;position:relative;
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease);
}
@media (hover:hover){.p-card:hover{transform:translateY(-3px);box-shadow:var(--sh-3)}}
.p-card:active{transform:translateY(-1px) scale(.99)}
.p-media{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--cream)}
.p-media .dish-art{width:100%;height:100%;display:block}
.p-badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.p-body{padding:var(--s4) var(--s4) var(--s5);display:flex;flex-direction:column;gap:7px;flex:1}
.p-name{font-size:18px;font-weight:700;color:var(--ink);line-height:1.25}
.p-desc{font-size:14.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-foot{margin-top:auto;padding-top:var(--s3);display:flex;align-items:center;justify-content:space-between;gap:10px}
.p-foot .t-price{white-space:nowrap}
.p-add{
  height:var(--tap-sm);min-width:var(--tap-sm);padding:0 15px;border-radius:var(--r-pill);
  background:var(--osaka);color:#fff;font-size:15px;font-weight:700;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--sh-red);
  transition:transform var(--t-fast) var(--ease),background var(--t) var(--ease),width var(--t) var(--ease);
}
.p-add svg{width:19px;height:19px}
@media (hover:hover){.p-add:hover{background:var(--osaka-deep)}}
.p-add:active{transform:scale(.93)}
.p-add.is-added{background:var(--ok)}
/* Produit indisponible */
.p-card.is-out .p-media .dish-art{filter:grayscale(.85) contrast(.9);opacity:.55}
.p-card.is-out .p-name,.p-card.is-out .t-price{color:var(--muted)}
.p-out-tag{position:absolute;inset:auto 0 0 0;padding:10px 14px;background:rgba(25,26,28,.86);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.p-out-tag svg{width:17px;height:17px}
.p-add[disabled]{background:var(--cream);color:var(--faint);box-shadow:none}
/* Compteur "déjà dans le panier" */
.p-incart{
  position:absolute;top:12px;right:12px;min-width:34px;height:34px;padding:0 10px;border-radius:99px;
  background:var(--ink);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-2);
}

/* ---------- 17. PANIER SIDEBAR ---------- */
.cart{
  border-left:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;min-height:0;box-shadow:-18px 0 40px rgba(60,44,28,.05);
}
.cart-head{padding:var(--s5) var(--s5) var(--s4);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.cart-items{flex:1;min-height:0;padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.c-item{background:var(--paper);border-radius:var(--r-md);padding:var(--s4);display:flex;flex-direction:column;gap:11px;animation:citemin var(--t-slow) var(--ease)}
@keyframes citemin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.c-top{display:flex;gap:12px;align-items:flex-start}
.c-thumb{width:54px;height:54px;border-radius:var(--r-sm);overflow:hidden;flex:0 0 auto;background:var(--cream)}
.c-thumb .dish-art{width:100%;height:100%}
.c-name{font-size:16px;font-weight:700;color:var(--ink);line-height:1.25}
.c-opts{font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:3px}
.c-note{font-size:13.5px;color:var(--osaka-ink);background:var(--osaka-soft);border-radius:8px;padding:6px 10px;margin-top:6px;display:flex;gap:7px;align-items:flex-start}
.c-note svg{width:15px;height:15px;flex:0 0 auto;margin-top:2px}
.c-bottom{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.c-edit{font-size:14.5px;font-weight:700;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:8px 4px;min-height:var(--tap-sm);display:inline-flex;align-items:center}
.cart-foot{border-top:1px solid var(--line);padding:var(--s5);background:var(--surface);display:flex;flex-direction:column;gap:var(--s4)}
.totals{display:flex;flex-direction:column;gap:9px}
.trow{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;color:var(--muted)}
.trow b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.trow-total{font-size:21px;color:var(--ink);font-weight:800;padding-top:10px;border-top:1px dashed var(--line-strong)}
.trow-total b{font-size:26px;color:var(--ink);font-weight:800}
.cart-cta{--btn-h:72px;font-size:19px}

/* ---------- 18. ÉCRANS GÉNÉRIQUES ---------- */
.page{flex:1;min-height:0;display:flex;flex-direction:column}
.page-body{flex:1;min-height:0}
.wrap{max-width:1180px;margin:0 auto;padding:var(--s7) var(--s8) var(--s9);width:100%}
.wrap-narrow{max-width:820px}
.page-head{display:flex;align-items:center;gap:var(--s4);padding:var(--s5) var(--s7);border-bottom:1px solid var(--line);background:rgba(252,250,246,.9)}

/* ---------- 19. ACCUEIL ---------- */
.home{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}
.home-left{padding:var(--s7) var(--s8) var(--s6);display:flex;flex-direction:column;justify-content:safe center;gap:var(--s5);min-width:0}
.home-hero-mark{display:flex;align-items:center;gap:var(--s4)}
.home-sun{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 34% 32%,#D8483F 0%,var(--osaka) 55%,var(--osaka-deep) 100%);box-shadow:0 8px 24px rgba(192,54,45,.3)}
.home-name{font-family:var(--font-display);font-size:54px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);font-weight:600;line-height:1}
.home-sub{font-size:15.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.home-meta{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.rating{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700;color:var(--ink)}
.rating svg{width:19px;height:19px;color:#D9A21B}
.dot-sep{width:4px;height:4px;border-radius:50%;background:var(--line-strong)}
.home-actions{display:flex;flex-direction:column;gap:var(--s3)}
.action-card{
  display:flex;align-items:center;gap:var(--s5);padding:var(--s4) var(--s5);min-height:92px;
  background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-2);text-align:left;
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease);position:relative;overflow:hidden;
}
@media (hover:hover){.action-card:hover{transform:translateY(-3px);box-shadow:var(--sh-3)}}
.action-card:active{transform:translateY(0) scale(.99)}
.action-ico{width:56px;height:56px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--cream);color:var(--ink)}
.action-ico svg{width:30px;height:30px}
.action-txt{flex:1;min-width:0}
.action-txt b{display:block;font-size:21px;font-weight:700;color:var(--ink);line-height:1.2}
.action-txt span{display:block;font-size:15.5px;color:var(--muted);margin-top:5px;line-height:1.35}
.action-arrow{width:46px;height:46px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:0 0 auto;transition:all var(--t) var(--ease)}
.action-arrow svg{width:22px;height:22px}
.action-card-primary{background:var(--osaka);box-shadow:var(--sh-red)}
.action-card-primary .action-txt b{color:#fff;font-size:23px}
.action-card-primary .action-txt span{color:rgba(255,255,255,.82)}
.action-card-primary .action-ico{background:rgba(255,255,255,.16);color:#fff}
.action-card-primary .action-arrow{background:rgba(255,255,255,.16);color:#fff}
.action-card-primary::after{
  content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;
  background:rgba(255,255,255,.07);
}
.home-right{position:relative;overflow:hidden;background:var(--cream)}
.home-art{position:absolute;inset:0}
.home-art svg{width:100%;height:100%;display:block}
.home-quote{
  position:absolute;left:var(--s7);right:var(--s7);bottom:var(--s7);
  background:rgba(25,26,28,.72);backdrop-filter:blur(8px);color:#fff;border-radius:var(--r-lg);padding:var(--s5) var(--s6);
}
.home-quote b{display:block;font-family:var(--font-display);font-size:22px;margin-bottom:6px}
.home-quote span{font-size:15px;color:rgba(255,255,255,.78);line-height:1.45}
.home-foot{display:flex;gap:var(--s3);align-items:center;margin-top:var(--s4)}

/* ---------- 20. FICHE PRODUIT ---------- */
.pd-media{position:relative;aspect-ratio:16/10;flex:0 0 auto;background:var(--cream)}
.pd-media .dish-art{width:100%;height:100%}
.pd-close{position:absolute;top:14px;right:14px;background:rgba(252,250,246,.94);box-shadow:var(--sh-2)}
.pd-badges{position:absolute;left:16px;bottom:16px;display:flex;gap:7px;flex-wrap:wrap}
.pd-body{flex:1;min-height:0;padding:var(--s6);display:flex;flex-direction:column;gap:var(--s6)}
.pd-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s5)}
.opt-group{display:flex;flex-direction:column;gap:var(--s3)}
.opt-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.opt-req{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--osaka)}
.opt-opt{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.opt-list{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:var(--s4);min-height:64px;padding:12px var(--s5);
  background:var(--surface);border-radius:var(--r-md);box-shadow:inset 0 0 0 1.5px var(--line);
  transition:box-shadow var(--t) var(--ease),background var(--t) var(--ease),transform var(--t-fast) var(--ease);text-align:left;
}
@media (hover:hover){.opt:hover{background:var(--cream)}}
.opt:active{transform:scale(.99)}
.opt-mark{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line-strong);flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:all var(--t) var(--ease)}
.opt-mark svg{width:17px;height:17px;color:#fff;opacity:0;transition:opacity var(--t) var(--ease)}
.opt-sq{border-radius:9px}
.opt-lbl{flex:1;font-size:17px;font-weight:600;color:var(--ink)}
.opt-price{font-size:16px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.opt[aria-checked="true"]{box-shadow:inset 0 0 0 2.5px var(--osaka);background:var(--osaka-soft)}
.opt[aria-checked="true"] .opt-mark{background:var(--osaka);box-shadow:none}
.opt[aria-checked="true"] .opt-mark svg{opacity:1}
.opt[aria-checked="true"] .opt-price{color:var(--osaka-ink)}
.opt[data-disabled="true"]{opacity:.4;pointer-events:none}
.pd-foot{flex:0 0 auto;padding:var(--s5) var(--s6);border-top:1px solid var(--line);background:var(--surface);display:flex;gap:var(--s4);align-items:center}
.allergen-row{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- 21. PANIER COMPLET ---------- */
.cart-full{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:var(--s6);align-items:start}
@media (max-width:1180px){.cart-full{grid-template-columns:1fr}}
.cf-item{display:flex;gap:var(--s5);padding:var(--s5);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);align-items:center}
.cf-thumb{width:132px;height:104px;border-radius:var(--r-md);overflow:hidden;flex:0 0 auto;background:var(--cream)}
.cf-thumb .dish-art{width:100%;height:100%}
.cf-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.cf-actions{display:flex;flex-direction:column;align-items:flex-end;gap:12px;flex:0 0 auto}
.summary-sticky{position:sticky;top:var(--s6)}

/* ---------- 22. CONFIRMATION / SUCCÈS ---------- */
.success{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s5);text-align:center;height:100%;padding:var(--s7)}
.success-mark{width:132px;height:132px;border-radius:50%;background:var(--ok-soft);display:flex;align-items:center;justify-content:center;position:relative}
.success-mark::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid var(--ok);opacity:.28;animation:ring 1.6s var(--ease) infinite}
@keyframes ring{0%{transform:scale(.86);opacity:.4}70%{transform:scale(1.1);opacity:0}100%{opacity:0}}
.success-mark svg{width:64px;height:64px;color:var(--ok);stroke-dasharray:60;stroke-dashoffset:60;animation:draw .55s var(--ease) .12s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.success-mark.is-red{background:var(--osaka-soft)}
.success-mark.is-red::before{border-color:var(--osaka)}
.success-mark.is-red svg{color:var(--osaka)}
.ticket{
  background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-2);padding:var(--s6) var(--s7);
  display:flex;flex-direction:column;gap:var(--s4);min-width:min(560px,100%);position:relative;overflow:hidden;
}
.ticket::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--osaka)}
.ticket-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s5);padding:12px 0;border-bottom:1px dashed var(--line)}
.ticket-row:last-child{border-bottom:0}
.ticket-row .tk-k{font-size:14.5px;color:var(--muted);font-weight:600}
.ticket-row .tk-v{font-size:19px;color:var(--ink);font-weight:700;text-align:right}
.code-big{font-family:var(--font-display);font-size:40px;letter-spacing:.06em;color:var(--osaka);font-weight:600}

/* Timeline commande */
.timeline{display:flex;align-items:flex-start;gap:0;width:100%}
.tl-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;text-align:center}
.tl-dot{width:44px;height:44px;border-radius:50%;background:var(--cream);color:var(--faint);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px var(--line-strong);z-index:2;transition:all var(--t) var(--ease)}
.tl-dot svg{width:22px;height:22px}
.tl-bar{position:absolute;top:21px;left:-50%;width:100%;height:3px;background:var(--line-strong);z-index:1}
.tl-step:first-child .tl-bar{display:none}
.tl-step.is-done .tl-dot{background:var(--ok);color:#fff;box-shadow:none}
.tl-step.is-done .tl-bar{background:var(--ok)}
.tl-step.is-current .tl-dot{background:var(--osaka);color:#fff;box-shadow:0 0 0 6px var(--osaka-soft)}
.tl-step.is-current .tl-bar{background:linear-gradient(90deg,var(--ok),var(--osaka))}
.tl-lbl{font-size:14.5px;font-weight:700;color:var(--ink)}
.tl-sub{font-size:13px;color:var(--muted)}
.tl-step:not(.is-done):not(.is-current) .tl-lbl{color:var(--faint)}

/* ---------- 23. RÉSERVATION ---------- */
.res-head{padding:var(--s5) var(--s7) var(--s4);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--s5);background:rgba(252,250,246,.94)}
.res-body{flex:1;min-height:0}
.res-inner{max-width:1180px;margin:0 auto;padding:var(--s7) var(--s7) var(--s8);
  display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:var(--s7);align-items:start}
.res-inner.is-single{grid-template-columns:minmax(0,1fr);max-width:940px}
.res-main{display:flex;flex-direction:column;gap:var(--s6);min-width:0}
.res-side{display:flex;flex-direction:column;gap:var(--s4);position:sticky;top:0}
.res-side .panel{padding:var(--s5)}
.side-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.side-row:last-child{border-bottom:0}
.side-row .sr-ico{width:38px;height:38px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:0 0 auto}
.side-row .sr-ico svg{width:19px;height:19px}
.side-row .sr-k{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.side-row .sr-v{font-size:16px;color:var(--ink);font-weight:700}
.side-row.is-todo .sr-v{color:var(--faint);font-weight:600}
@media (max-width:1080px){.res-inner{grid-template-columns:minmax(0,1fr)}.res-side{display:none}}
.res-foot{flex:0 0 auto;padding:var(--s5) var(--s7);border-top:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}

.pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4)}
.pick-grid-6{grid-template-columns:repeat(6,1fr)}
@media (max-width:820px){.pick-grid-6{grid-template-columns:repeat(3,1fr)}}
.pick{
  min-height:104px;border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line),var(--sh-1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  transition:all var(--t) var(--ease);
}
.pick b{font-size:34px;font-weight:700;color:var(--ink);line-height:1;font-family:var(--font-display)}
.pick span{font-size:14px;color:var(--muted);font-weight:600}
@media (hover:hover){.pick:hover{box-shadow:inset 0 0 0 1.5px var(--line-strong),var(--sh-2);transform:translateY(-2px)}}
.pick:active{transform:scale(.98)}
.pick[aria-pressed="true"]{background:var(--osaka);box-shadow:var(--sh-red)}
.pick[aria-pressed="true"] b,.pick[aria-pressed="true"] span{color:#fff}
.pick-wide{grid-column:span 2;flex-direction:row;gap:12px}
.pick-wide b{font-size:24px}

/* Choix maintenant / plus tard */
.big-choice{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5)}
.bc{
  padding:var(--s6);border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--sh-2);text-align:left;
  display:flex;flex-direction:column;gap:var(--s3);min-height:210px;transition:all var(--t) var(--ease);position:relative;
}
.bc-ico{width:58px;height:58px;border-radius:var(--r-md);background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.bc-ico svg{width:28px;height:28px}
.bc b{font-size:23px;color:var(--ink);font-weight:700}
.bc p{font-size:15.5px;color:var(--muted);line-height:1.4;margin:0}
.bc-status{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--ok-soft);color:var(--ok);align-self:flex-start}
.bc-status.is-wait{background:var(--warn-soft);color:var(--warn)}
.bc-status.is-full{background:var(--danger-soft);color:var(--danger)}
@media (hover:hover){.bc:hover{transform:translateY(-3px);box-shadow:var(--sh-3)}}
.bc[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--osaka),var(--sh-2)}

/* Dates rapides */
.date-quick{display:flex;gap:var(--s3);flex-wrap:wrap}
.dq{
  min-width:126px;min-height:92px;padding:14px var(--s4);border-radius:var(--r-lg);background:var(--surface);
  box-shadow:inset 0 0 0 1.5px var(--line),var(--sh-1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:all var(--t) var(--ease);
}
.dq small{font-size:13.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.dq b{font-size:26px;color:var(--ink);font-weight:700;line-height:1.1}
.dq span{font-size:13px;color:var(--faint)}
@media (hover:hover){.dq:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1.5px var(--line-strong),var(--sh-2)}}
.dq[aria-pressed="true"]{background:var(--ink);box-shadow:var(--sh-2)}
.dq[aria-pressed="true"] b{color:#fff}
.dq[aria-pressed="true"] small,.dq[aria-pressed="true"] span{color:rgba(255,255,255,.65)}

/* Calendrier */
.cal{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-2);padding:var(--s5);max-width:520px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s4)}
.cal-month{font-size:19px;font-weight:700;color:var(--ink);text-transform:capitalize}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-dow span{text-align:center;font-size:12.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{
  height:58px;border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:17px;font-weight:600;color:var(--ink);transition:all var(--t-fast) var(--ease);
}
@media (hover:hover){.cal-day:not([disabled]):hover{background:var(--cream)}}
.cal-day[disabled]{color:var(--faint);opacity:.5;pointer-events:none}
.cal-day.is-today{box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.cal-day[aria-pressed="true"]{background:var(--osaka);color:#fff;box-shadow:var(--sh-red)}
.cal-day i{width:5px;height:5px;border-radius:50%;background:var(--osaka);display:block}
.cal-day[aria-pressed="true"] i{background:#fff}
.cal-empty{height:58px}

/* Horaires */
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:var(--s3)}
.slot{
  min-height:82px;border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line),var(--sh-1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:all var(--t) var(--ease);
}
.slot b{font-size:23px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.slot small{font-size:12.5px;font-weight:700;color:var(--ok)}
@media (hover:hover){.slot:not([disabled]):hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1.5px var(--line-strong),var(--sh-2)}}
.slot.is-tight small{color:var(--warn)}
.slot[disabled]{background:var(--cream);box-shadow:none;pointer-events:none}
.slot[disabled] b{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1.5px}
.slot[disabled] small{color:var(--faint)}
.slot[aria-pressed="true"]{background:var(--osaka);box-shadow:var(--sh-red)}
.slot[aria-pressed="true"] b{color:#fff}
.slot[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.service-tabs{display:inline-flex;background:var(--cream);padding:5px;border-radius:var(--r-pill);gap:5px}

/* Récap réservation */
.recap{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-2);overflow:hidden}
.recap-head{padding:var(--s5) var(--s6);background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px}
.recap-row{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) var(--s6);border-bottom:1px solid var(--line)}
.recap-row:last-child{border-bottom:0}
.recap-ico{width:44px;height:44px;border-radius:var(--r-sm);background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:0 0 auto}
.recap-ico svg{width:22px;height:22px}
.recap-k{font-size:13.5px;color:var(--muted);font-weight:600}
.recap-v{font-size:18px;color:var(--ink);font-weight:700}

/* Clavier numérique tactile */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:312px;flex:0 0 312px}
@media (max-width:900px){.keypad{width:100%;flex:1 1 auto;max-width:360px}}
.key{
  height:74px;border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line),var(--sh-1);
  font-size:27px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;
  transition:all var(--t-fast) var(--ease);
}
@media (hover:hover){.key:hover{background:var(--cream)}}
.key:active{transform:scale(.95);background:var(--sand)}
.key-fn{background:var(--cream);box-shadow:none;color:var(--ink-2)}
.key svg{width:26px;height:26px}
.phone-display{
  min-height:80px;border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-strong);
  display:flex;align-items:center;padding:0 var(--s6);font-size:30px;font-weight:700;letter-spacing:.08em;color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.phone-display.is-empty{color:var(--faint);font-weight:500;letter-spacing:normal;font-size:21px}
.caret{display:inline-block;width:2px;height:30px;background:var(--osaka);margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- 24. DEMO PANEL ---------- */
.demo-chip{
  height:52px;padding:0 18px;border-radius:var(--r-pill);font-size:14.5px;font-weight:700;color:var(--muted);
  display:inline-flex;align-items:center;gap:9px;box-shadow:inset 0 0 0 1.5px var(--line-strong);
}
.demo-chip svg{width:19px;height:19px}
@media (hover:hover){.demo-chip:hover{background:var(--cream);color:var(--ink)}}
@media (max-width:1180px){.demo-chip span{display:none}.demo-chip{padding:0 16px}}
.demo-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.demo-item{
  display:flex;align-items:center;gap:12px;min-height:62px;padding:12px var(--s4);border-radius:var(--r-md);
  background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);text-align:left;font-size:15.5px;font-weight:600;color:var(--ink);
  transition:all var(--t) var(--ease);
}
@media (hover:hover){.demo-item:hover{background:var(--cream)}}
.demo-item:active{transform:scale(.98)}
.demo-item i{width:34px;height:34px;border-radius:9px;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--osaka);flex:0 0 auto}
.demo-item i svg{width:19px;height:19px}

/* ---------- 25. DESIGN SYSTEM ---------- */
.ds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s4)}
.swatch{border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-1);background:var(--surface)}
.swatch-c{height:88px}
.swatch-m{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.swatch-m b{font-size:14.5px;color:var(--ink)}
.swatch-m span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ds-section{padding:var(--s7) 0;border-bottom:1px solid var(--line)}
.ds-section:last-child{border-bottom:0}
.ds-row{display:flex;flex-wrap:wrap;gap:var(--s4);align-items:center}
.ds-label{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:var(--s3)}
.ds-box{background:var(--surface);border-radius:var(--r-lg);padding:var(--s5);box-shadow:var(--sh-1)}
.spec-line{display:flex;align-items:center;gap:var(--s4);padding:10px 0;border-bottom:1px dashed var(--line)}
.spec-line:last-child{border-bottom:0}
.spec-line code{font-size:13.5px;background:var(--cream);padding:4px 9px;border-radius:6px;color:var(--osaka-ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.ds-bar{height:22px;background:var(--osaka-tint);border-radius:4px}

/* ---------- 26. UTILITAIRES ---------- */
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.gap1{gap:var(--s1)}.gap2{gap:var(--s2)}.gap3{gap:var(--s3)}.gap4{gap:var(--s4)}
.gap5{gap:var(--s5)}.gap6{gap:var(--s6)}.gap7{gap:var(--s7)}
.mt2{margin-top:var(--s2)}.mt3{margin-top:var(--s3)}.mt4{margin-top:var(--s4)}
.mt5{margin-top:var(--s5)}.mt6{margin-top:var(--s6)}.mt7{margin-top:var(--s7)}
.grow{flex:1;min-width:0}
.wrapf{flex-wrap:wrap}
.between{justify-content:space-between}
.acenter{align-items:center}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 27. RESPONSIVE ---------- */
/* Écran un peu plus étroit : panier plus compact */
@media (max-width:1280px){
  :root{--col-cat:212px;--col-cart:330px}
  .home-name{font-size:52px}
}
/* Portrait / petit écran : le panier devient un tiroir */
@media (max-width:1080px){
  .menu-layout{grid-template-columns:var(--col-cat) minmax(0,1fr)}
  .cart{position:absolute;top:0;right:0;bottom:0;width:min(420px,86%);z-index:65;transform:translateX(101%);
        transition:transform var(--t-slow) var(--ease);box-shadow:var(--sh-4)}
  .cart.is-open{transform:none}
  .cart-scrim{position:absolute;inset:0;background:rgba(30,22,14,.42);z-index:64;animation:fade var(--t) var(--ease)}
  .home{grid-template-columns:1fr}
  .home-right{display:none}
  .home-left{padding:var(--s7) var(--s6)}
  .big-choice{grid-template-columns:1fr}
  .cart-fab{display:flex!important}
  .cart-fab-close{display:inline-flex!important}
}
@media (min-width:1081px){
  .cart-fab{display:none!important}
  .cart-scrim{display:none}
}
.cart-fab{
  position:absolute;right:20px;bottom:20px;z-index:55;height:66px;padding:0 24px;border-radius:99px;
  background:var(--osaka);color:#fff;font-size:17px;font-weight:700;align-items:center;gap:14px;box-shadow:var(--sh-red);
}
.cart-fab svg{width:24px;height:24px}
.cart-fab .cf-count{min-width:30px;height:30px;border-radius:99px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}

@media (max-width:820px){
  :root{--topbar:70px}
  .nav-item{min-width:0;padding:0 var(--s4)}
  .nav-item span{display:none}
  .cats{position:static}
  .menu-layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .cats{border-right:0;border-bottom:1px solid var(--line)}
  .cats-head{display:none}
  .cats-list{flex-direction:row;overflow-x:auto;padding:var(--s3);gap:8px}
  .cat{min-height:var(--tap);white-space:nowrap;flex:0 0 auto}
  .cat-count{display:none}
  .pick-grid{grid-template-columns:repeat(3,1fr)}
  .wrap{padding:var(--s6) var(--s5) var(--s8)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

/* ---------- UTILITAIRES ---------- */
const $=function(s,r){return (r||document).querySelector(s);};
const $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function eur(n){return n.toFixed(2).replace('.',',')+' €';}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,10);}
function todayISO(){var d=new Date();return d.toISOString().slice(0,10);}
const DOW=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const DOW_S=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const MON=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDateLong(iso){var d=parseISO(iso);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
function fmtDateShort(iso){var d=parseISO(iso);return DOW_S[d.getDay()]+' '+d.getDate();}
function addDays(iso,n){var d=parseISO(iso);d.setDate(d.getDate()+n);return isoOf(d);}
function prod(id){for(var i=0;i<PRODUCTS.length;i++){if(PRODUCTS[i].id===id)return PRODUCTS[i];}return null;}
function catName(id){for(var i=0;i<CATS.length;i++){if(CATS[i].id===id)return CATS[i].name;}return '';}
function productsOf(cat){
 if(cat==='sugg')return PRODUCTS.filter(function(p){return p.sugg;});
 return PRODUCTS.filter(function(p){return p.cat===cat;});
}
function countOf(cat){return productsOf(cat).length;}

/* Panier */
function cartCount(){return S.cart.reduce(function(a,l){return a+l.qty;},0);}
function lineUnit(l){var p=prod(l.pid),t=p.price;
 (l.opts||[]).forEach(function(o){t+=o.price||0;});return t;}
function lineTotal(l){return lineUnit(l)*l.qty;}
function cartSubtotal(){return S.cart.reduce(function(a,l){return a+lineTotal(l);},0);}
function optsLabel(l){return (l.opts||[]).map(function(o){return o.label;}).join(' · ');}

function toast(msg,kind){

 el.className='toast '+(kind==='err'?'toast-err':'toast-ok');

 setTimeout(function(){el.classList.add('is-out');setTimeout(function(){el.remove();},220);},2400);
}

function filteredProducts(){
 var list;
 if(S.query.trim()){
  var q=S.query.trim().toLowerCase();
  list=PRODUCTS.filter(function(p){
   return (p.name+' '+p.desc+' '+catName(p.cat)).toLowerCase().indexOf(q)>=0;});
 }else{list=productsOf(S.cat);}
 if(S.filters.length){
  list=list.filter(function(p){return S.filters.every(function(f){return (p.badges||[]).indexOf(f)>=0;});});
 }
 return list;
}

/* ---------- PANIER : opérations ---------- */
function sig(pid,opts,note){
 return pid+'|'+(opts||[]).map(function(o){return o.gid+':'+o.cid;}).sort().join(',')+'|'+(note||'').trim();
}
function addToCart(pid,opts,note,qty){
 var s=sig(pid,opts,note),found=null;
 S.cart.forEach(function(l){if(sig(l.pid,l.opts,l.note)===s)found=l;});
 if(found){found.qty+=(qty||1);}
 else{S.cart.push({id:uid(),pid:pid,opts:opts||[],note:note||'',qty:qty||1});}
}
function defaultOpts(p){
 var out=[],ok=true;
 (p.options||[]).forEach(function(g){
  if(g.type==='single'){
   var d=g.choices.filter(function(c){return c.def;})[0]||(g.required?g.choices[0]:null);
   if(d)out.push({gid:g.id,cid:d.id,label:d.label,price:d.price||0});
  }else if(g.required){ok=false;}
 });
 return ok?out:null;
}
function quickAdd(id,btn){
 var p=prod(id);if(!p||p.out)return false;
 var o=defaultOpts(p);
 if(o===null){openProduct(id);return false;}
 addToCart(id,o,'',1);
 if(btn){
  var prev=btn.innerHTML;
  btn.classList.add('is-added');btn.innerHTML=ic('check')+' Ajouté';
  setTimeout(function(){btn.classList.remove('is-added');btn.innerHTML=prev;},1100);
 }
 refreshCart();
 var card=btn&&btn.closest('.p-card');
 if(card){var b=card.querySelector('.p-incart');
  if(b){b.textContent=inCartQty(id);b.classList.remove('q-bump');void b.offsetWidth;b.classList.add('q-bump');}
  else{var m=card.querySelector('.p-media');
   if(m){var s=document.createElement('span');s.className='p-incart num q-bump';s.textContent=inCartQty(id);m.appendChild(s);}}}
 return true;
}
function changeQty(lineId,delta){
 var idx=-1;S.cart.forEach(function(l,i){if(l.id===lineId)idx=i;});
 if(idx<0)return;
 var l=S.cart[idx];
 l.qty+=delta;
 if(l.qty<=0){S.cart.splice(idx,1);toast('Plat retiré de votre commande');}
 if(S.route==='cart'){render();}else{refreshCart();refreshCatalog();}
}

var PD=null; /* état de la fiche ouverte */
function openProduct(id,lineId){
 var p=prod(id);if(!p)return;
 var line=lineId?S.cart.filter(function(l){return l.id===lineId;})[0]:null;
 PD={pid:id,lineId:lineId||null,qty:line?line.qty:1,note:line?line.note:'',sel:{}};
 (p.options||[]).forEach(function(g){
  PD.sel[g.id]=[];
  if(line){line.opts.forEach(function(o){if(o.gid===g.id)PD.sel[g.id].push(o.cid);});}
  else if(g.type==='single'){
   var d=g.choices.filter(function(c){return c.def;})[0];
   if(d)PD.sel[g.id]=[d.id];
  }
 });
 layer('<div class="drawer-wrap" data-overlay><div class="drawer" role="dialog" aria-modal="true" id="pdDrawer">'+productSheetHTML()+'</div></div>');
}
function pdPrice(){
 var p=prod(PD.pid),t=p.price;
 (p.options||[]).forEach(function(g){
  (PD.sel[g.id]||[]).forEach(function(cid){
   g.choices.forEach(function(c){if(c.id===cid)t+=c.price||0;});});});
 return t*PD.qty;
}
function pdValid(){
 var p=prod(PD.pid),ok=true;
 (p.options||[]).forEach(function(g){if(g.required&&!(PD.sel[g.id]||[]).length)ok=false;});
 return ok;
}
function productSheetHTML(){

   +'<div class="opt-list" role="group">'
   +g.choices.map(function(c){

      +' data-act="opt" data-g="'+g.id+'" data-c="'+c.id+'" data-type="'+g.type+'">'
      +'<span class="opt-mark '+(g.type==='multi'?'opt-sq':'')+'">'+ic('check')+'</span>'

       :'<p class="t-body">Aucun allergène majeur déclaré pour ce plat.</p>')
     +'<div class="notice">'+ic('shield')+'<div>Pour toute allergie sévère, merci de demander confirmation à notre équipe avant de commander.</div></div>'
   +'</div>'
   +groups
   +'<div class="field"><label class="field-label" for="pdNote">Une remarque pour la cuisine ?</label>'
     +'<textarea class="textarea" id="pdNote" placeholder="Par exemple : « Sans oignon »" maxlength="140">'+esc(PD.note)+'</textarea>'
     +'<div class="field-hint">Facultatif — la cuisine en tiendra compte si possible.</div></div>'
 +'</div>'
 +'<div class="pd-foot">'
   +(p.out
     ? '<div class="notice notice-danger grow">'+ic('info')+'<div><b>Indisponible actuellement.</b> Ce plat reviendra très vite à la carte.</div></div>'
     : qtyHTML('pd',PD.qty,{})
       +'<button class="btn btn-primary btn-lg btn-split grow" data-act="'+(PD.lineId?'update-line':'add-to-cart')+'" '+(pdValid()?'':'aria-disabled="true"')+'>'
       +'<span>'+(PD.lineId?'Mettre à jour':'Ajouter au panier')+'</span><span class="num">'+eur(pdPrice())+'</span></button>')

function doConfirmOrder(btn){
 if(btn){btn.classList.add('is-loading');}
 setTimeout(function(){
  if(S.orderError){
   if(btn)btn.classList.remove('is-loading');
   modal({title:'Votre commande n’a pas pu être envoyée',
    sub:'Aucun paiement ou commande supplémentaire n’a été enregistré. Vous pouvez réessayer sans risque de doublon.',
    body:'<div class="notice notice-danger">'+ic('alert')+'<div>La liaison avec la cuisine a été interrompue. Votre panier est intact.</div></div>',
    foot:'<button class="btn btn-secondary grow" data-act="close-layer">Plus tard</button>'
      +'<button class="btn btn-primary grow" data-act="retry-order">'+ic('refresh')+'Réessayer</button>'});
   return;
  }
  var total=cartSubtotal();
  S.orders.push({no:S.nextOrderNo++,lines:S.cart.slice(),note:S.orderNote,total:total,
    count:cartCount(),eta:15,status:'sent',t:Date.now()});
  S.cart=[];S.orderNote='';
  S.route='order-sent';render();
  /* progression réaliste du statut */
  var o=S.orders[S.orders.length-1];
  setTimeout(function(){o.status='prep';if(S.route==='order-status')render();},9000);
  setTimeout(function(){o.status='served';if(S.route==='order-status')render();},26000);
 },900);
}

const RES_STEPS=['Personnes','Date','Horaire','Coordonnées','Confirmation'];
function resProgressIndex(){var m={0:0,1:1,2:1,3:2,4:2,5:3,6:4};return m[S.res.step]||0;}
function hashN(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h%100;}
const SLOTS_MIDI=['11:45','12:00','12:15','12:30','12:45','13:00','13:15','13:30','13:45','14:00'];
const SLOTS_SOIR=['19:00','19:15','19:30','19:45','20:00','20:15','20:30','20:45','21:00','21:15','21:30'];
function slotState(iso,t){
 var h=hashN(iso+t+S.res.people);
 if(h<14)return 'none';
 if(h<34)return 'tight';
 return 'ok';
}
function fmtPhone(v){return v.replace(/(\d{2})(?=\d)/g,'$1 ').trim();}

function resHeader(){
 var idx=resProgressIndex();
 return '<div class="res-head">'
  +'<button class="icon-btn" data-act="res-back" aria-label="Étape précédente">'+ic('arrL')+'</button>'
  +'<div class="stepper grow">'+RES_STEPS.map(function(l,i){
    var cls=i<idx?'is-done':(i===idx?'is-current':'');
    return (i?'<span class="step-sep"></span>':'')
     +'<div class="step '+cls+'"><span class="step-bullet">'+(i<idx?ic('check'):(i+1))+'</span>'
     +'<span class="step-lbl">'+l+'</span></div>';
   }).join('')+'</div>'
  +'<button class="btn btn-tertiary" data-act="res-cancel">Annuler</button>'
 +'</div>';
}
function resFoot(nextLabel,enabled,hint){
 return '<div class="res-foot">'
  +'<span class="t-sm">'+(hint||'Vous pouvez revenir en arrière à tout moment.')+'</span>'
  +'<button class="btn btn-primary btn-xl" data-act="res-next" '+(enabled?'':'aria-disabled="true"')+'>'
  +nextLabel+ic('arrR')+'</button></div>';
}

/* Calendrier */
var CAL={y:0,m:0};
function openCalendar(){
 var d=parseISO(S.res.date);CAL.y=d.getFullYear();CAL.m=d.getMonth();
 modal({title:'Choisir une date',sub:'Nous acceptons les réservations jusqu’à 60 jours à l’avance.',
  body:'<div id="calHost">'+calendarHTML()+'</div>',
  foot:'<button class="btn btn-secondary grow" data-act="close-layer">Annuler</button>'
   +'<button class="btn btn-primary grow" data-act="close-layer">Valider</button>'});
}
function calendarHTML(){
 var first=new Date(CAL.y,CAL.m,1),start=(first.getDay()+6)%7,days=new Date(CAL.y,CAL.m+1,0).getDate();
 var today=todayISO(),max=addDays(today,60);
 var cells='';
 for(var i=0;i<start;i++)cells+='<div class="cal-empty"></div>';
 for(var d=1;d<=days;d++){
  var iso=isoOf(new Date(CAL.y,CAL.m,d));
  var dis=(iso<today||iso>max);
  var closedDay=parseISO(iso).getDay()===1; /* fermé le lundi */
  cells+='<button class="cal-day '+(iso===today?'is-today':'')+'" data-act="cal-day" data-d="'+iso+'"'
   +((dis||closedDay)?' disabled':'')+' aria-pressed="'+(S.res.date===iso)+'">'
   +'<span class="num">'+d+'</span>'+(!dis&&!closedDay&&hashN(iso)<30?'<i></i>':'')+'</button>';
 }
 return '<div class="cal">'
  +'<div class="cal-head"><button class="icon-btn icon-btn-sm" data-act="cal-nav" data-n="-1" aria-label="Mois précédent">'+ic('chevL')+'</button>'
  +'<span class="cal-month">'+MON[CAL.m]+' '+CAL.y+'</span>'
  +'<button class="icon-btn icon-btn-sm" data-act="cal-nav" data-n="1" aria-label="Mois suivant">'+ic('chevR')+'</button></div>'
  +'<div class="cal-dow">'+['lun','mar','mer','jeu','ven','sam','dim'].map(function(x){return '<span>'+x+'</span>';}).join('')+'</div>'
  +'<div class="cal-grid">'+cells+'</div>'
  +'<p class="t-sm mt4">'+ic('info',null)+' Fermé le lundi. Un point rouge indique une forte affluence.</p></div>';
}

/* ==========================================================================
   CONFIDENTIALITÉ / SESSION
   ========================================================================== */
var privacyTimer=null,countdownTimer=null;
function privacySensitive(){
 return (S.route==='reserve'&&S.res&&S.res.step>=5)||['find-res','res-found','res-confirmed','waitlist','waitlist-joined'].indexOf(S.route)>=0;
}
function armPrivacy(){
 clearTimeout(privacyTimer);
 if(!privacySensitive())return;
 privacyTimer=setTimeout(showStillThere,60000);
}
function showStillThere(){
 if($('#stillThere'))return;
 var left=15;
 var node=layer('<div class="overlay" id="stillThere"><div class="modal" role="alertdialog" aria-modal="true">'
  +'<div class="modal-head"><div class="grow"><h2 class="t-h2">Êtes-vous toujours là ?</h2>'
  +'<p class="t-sm mt2">Pour protéger vos informations, cette tablette revient à l’accueil dans <b id="ctd">'+left+'</b> secondes.</p></div></div>'
  +'<div class="modal-body"><div class="notice">'+ic('lock')+'<div>Nom, téléphone, e-mail et réservation consultée seront effacés. Votre table et vos commandes en cours sont conservées.</div></div></div>'
  +'<div class="modal-foot"><button class="btn btn-secondary grow" data-act="privacy-reset">Terminer maintenant</button>'
  +'<button class="btn btn-primary grow" data-act="privacy-stay">'+ic('check')+'Je suis toujours là</button></div></div></div>');
 clearInterval(countdownTimer);
 countdownTimer=setInterval(function(){
  left--;var el=$('#ctd',node);if(el)el.textContent=left;
  if(left<=0){clearInterval(countdownTimer);privacyReset();}
 },1000);
}
function privacyReset(){
 clearInterval(countdownTimer);clearTimeout(privacyTimer);
 S.res=null;S.lastRes=null;S.waitlist=null;findPhone='';WL={people:2,name:'',phone:''};
 closeAllLayers();S.route='home';render();
}

function openDemo(){
 var items=[
  ['fill','Remplir le panier','bag'],['empty','Vider le panier','trash'],
  ['loading','Chargement de la carte','hourglass'],['net','Erreur réseau','wifiOff'],
  ['ordererr','Erreur d’envoi de commande','alert'],['out','Produit indisponible','info'],
  ['full','Restaurant complet : '+(S.full?'oui':'non'),'users'],['closed','Restaurant fermé','moon'],
  ['status','Commande en préparation','flame'],['resdemo','Réservation confirmée','calendar'],
  ['found','Réservation retrouvée','search'],['waitlist','Liste d’attente','bell'],
  ['privacy','Timeout confidentialité','lock'],['ds','Design system','palette']
 ];
 sheet({title:'Scénarios de démonstration',sub:'Ces raccourcis servent à présenter les états que l’on ne peut pas déclencher naturellement.',
  body:'<div class="demo-list">'+items.map(function(x){
    return '<button class="demo-item" data-act="demo" data-k="'+x[0]+'"><i>'+ic(x[2])+'</i>'+x[1]+'</button>';}).join('')+'</div>'});
}
function runDemo(k){
 closeAllLayers();
 if(k!=='net'){S.netError=false;S.menuLoaded=true;}
 if(k==='fill'){
  S.cart=[];
  addToCart('r1',[{gid:'prot',cid:'porc',label:'Porc mariné (chashu)',price:0},{gid:'cuisson',cid:'std',label:'Standard',price:0}],'Sans oignon',1);
  addToCart('b1',[{gid:'taille',cid:'33',label:'33 cl',price:0}],'',1);
  addToCart('k1',[{gid:'sauce',cid:'sucree',label:'Sauce soja sucrée',price:0}],'',2);
  S.route='menu';toast('Panier d’exemple ajouté');
 }
 else if(k==='empty'){S.cart=[];S.orderNote='';S.route='cart';}
 else if(k==='loading'){S.netError=false;S.route='menu';S.loading=true;render();
  setTimeout(function(){S.loading=false;refreshCatalog();},2600);return;}
 else if(k==='net'){S.netError=true;S.loading=false;S.route='menu';}
 else if(k==='ordererr'){S.orderError=!S.orderError;toast(S.orderError?'Prochain envoi : erreur simulée':'Envoi de commande rétabli');
  S.route=S.cart.length?'cart':'menu';}
 else if(k==='out'){S.route='menu';S.cat='sushis';S.query='';}
 else if(k==='full'){S.full=!S.full;toast(S.full?'Restaurant marqué complet':'Places à nouveau disponibles');S.route='reserve';S.res=newRes();S.res.step=1;}
 else if(k==='closed'){S.closed=!S.closed;S.route=S.closed?'closed':'home';}
 else if(k==='status'){
  if(!S.orders.length){S.orders.push({no:S.nextOrderNo++,lines:[
    {id:uid(),pid:'r1',qty:1,note:'Sans oignon',opts:[{gid:'prot',cid:'porc',label:'Porc mariné (chashu)',price:0}]},
    {id:uid(),pid:'b1',qty:1,note:'',opts:[{gid:'taille',cid:'33',label:'33 cl',price:0}]}],
    note:'',total:17.7,count:2,eta:15,status:'prep',t:Date.now()});}
  else{S.orders[S.orders.length-1].status='prep';}
  S.route='order-status';}
 else if(k==='resdemo'){
  S.lastRes={people:2,when:'later',date:todayISO(),time:'20:00',pref:'salle',name:'Teo',phone:'0612345678',sms:true,code:'#A472'};
  S.route='res-confirmed';}
 else if(k==='found'){
  S.lastRes={people:2,when:'later',date:todayISO(),time:'20:00',pref:'salle',name:'Teo',phone:'0612345678',sms:true,code:'#A472'};
  S.route='res-found';}
 else if(k==='waitlist'){S.full=true;WL={people:2,name:'',phone:''};S.route='waitlist';}
 else if(k==='privacy'){if(!privacySensitive()){S.route='find-res';findPhone='0612345678';}render();showStillThere();return;}
 else if(k==='ds'){S.route='ds';}
 render();
}

/* ==========================================================================
   RENDU
   ========================================================================== */
function render(){
 renderTopbar();
 var h;
 switch(S.route){
  case 'menu':h=screenMenu();break;
  case 'cart':h=screenCart();break;
  case 'order-sent':h=screenOrderSent();break;
  case 'order-status':h=screenOrderStatus();break;
  case 'reserve':h=screenReserve();break;
  case 'res-confirmed':h=screenResConfirmed();break;
  case 'find-res':h=screenFindRes();break;
  case 'res-found':h=screenResFound();break;
  case 'arrival-ok':h=screenArrivalOk();break;
  case 'waitlist':h=screenWaitlist();break;
  case 'waitlist-joined':h=screenWaitlistJoined();break;
  case 'closed':h=screenClosed();break;
  case 'ds':h=screenDS();break;
  default:h=screenHome();
 }
 $('#screen').innerHTML=h;
 armPrivacy();
}
function goto(to){
 if(to==='menu'){
  if(S.closed){S.route='closed';render();return;}
  S.route='menu';S.cartOpen=false;
  if(!S.menuLoaded&&!S.netError){S.loading=true;render();
   setTimeout(function(){S.loading=false;S.menuLoaded=true;refreshCatalog();},850);return;}
 }
 else if(to==='cart'){S.route=S.cart.length?'cart':(S.orders.length?'order-status':'cart');}
 else if(to==='reserve'){if(!S.res)S.res=newRes();S.route='reserve';}
 else{S.route=to;}
 render();
}

var keyTarget='res';

function updatePhoneUI(){
 var out=$('#phoneOut');if(!out)return;
 var v=keyTarget==='find'?findPhone:(S.res?S.res.phone:'');
 out.className='phone-display '+(v?'':'is-empty');
 out.innerHTML=(v?fmtPhone(v):'06 12 34 56 78')+'<i class="caret"></i>';
 if(keyTarget==='find'){
  var b=$('[data-act="do-find"]');if(b)b.setAttribute('aria-disabled',findPhone.length>=10?'false':'true');
 }else{
  var b2=$('[data-act="res-next"]');
  if(b2)b2.setAttribute('aria-disabled',(S.res.name.trim().length>1&&S.res.phone.length>=10)?'false':'true');
 }
}
function bump(el){if(!el)return;el.classList.remove('q-bump');void el.offsetWidth;el.classList.add('q-bump');}

function resNext(){
 var r=S.res;
 if(r.step===0){r.step=1;}
 else if(r.step===1){
  if(!r.when)return;
  if(r.when==='now'){
   if(S.full){S.route='waitlist';render();return;}
   r.date=todayISO();r.time=null;r.step=4;
  }else{r.step=2;}
 }
 else if(r.step===2){r.step=3;}
 else if(r.step===3){if(!r.time)return;r.step=4;}
 else if(r.step===4){r.step=5;}
 else if(r.step===5){if(!(r.name.trim().length>1&&r.phone.length>=10))return;r.step=6;}
 render();
}
function resBack(){
 var r=S.res;
 if(!r||r.step===0){S.res=null;S.route='home';render();return;}
 if(r.step===4&&r.when==='now')r.step=1;else r.step--;
 render();
}

document.addEventListener('click',function(e){
 var t=e.target.closest('[data-act]');
 if(!t){
  if(e.target.hasAttribute&&e.target.hasAttribute('data-overlay')){closeTop();}
  return;
 }
 var a=t.getAttribute('data-act'),id=t.getAttribute('data-id');

 switch(a){
 /* Navigation */
 case 'nav':goto(t.getAttribute('data-to'));break;
 case 'help':closeAllLayers();openHelp();break;
 case 'close-layer':closeTop();break;

 /* Carte */
 case 'cat':S.cat=id;S.query='';S.filters=[];render();break;
 case 'clear-q':S.query='';render();break;
 case 'reset-search':S.query='';S.filters=[];render();break;
 case 'retry-menu':S.netError=false;S.loading=true;render();
   setTimeout(function(){S.loading=false;S.menuLoaded=true;refreshCatalog();},1100);break;
 case 'filters':
   sheet({title:'Filtrer la carte',sub:'Affinez selon vos envies ou vos contraintes.',
    body:'<div class="ds-row">'+Object.keys(BADGE_META).map(function(k){
      return '<button class="chip" style="height:56px;font-size:17px" data-act="filter-toggle" data-k="'+k+'" aria-pressed="'+(S.filters.indexOf(k)>=0)+'">'
       +ic(BADGE_META[k].icon)+BADGE_META[k].label+'</button>';}).join('')+'</div>',
    foot:'<button class="btn btn-secondary grow" data-act="filters-clear">Tout effacer</button>'
     +'<button class="btn btn-primary grow" data-act="close-layer">Voir les plats</button>'});
   break;
 case 'filter-toggle':{
   var k=t.getAttribute('data-k'),i=S.filters.indexOf(k);
   if(i>=0)S.filters.splice(i,1);else S.filters.push(k);
   t.setAttribute('aria-pressed',S.filters.indexOf(k)>=0);
   refreshCatalog();break;}
 case 'filters-clear':S.filters=[];closeTop();render();break;
 case 'toggle-cart':S.cartOpen=!S.cartOpen;
   var cp=$('#cartPanel');if(cp)cp.classList.toggle('is-open',S.cartOpen);break;

 /* Produit */
 case 'open-product':openProduct(id);break;
 case 'quick-add':if(quickAdd(id,t))toast(prod(id).name+' ajouté à votre commande');break;
 case 'opt':{
   var g=t.getAttribute('data-g'),c=t.getAttribute('data-c'),ty=t.getAttribute('data-type');
   if(ty==='single'){PD.sel[g]=[c];}
   else{var arr=PD.sel[g]||[],j=arr.indexOf(c);if(j>=0)arr.splice(j,1);else arr.push(c);PD.sel[g]=arr;}
   refreshProductSheet();break;}
 case 'add-to-cart':{
   if(t.getAttribute('aria-disabled')==='true'){toast('Choisissez d’abord les options obligatoires','err');break;}
   var note=$('#pdNote');PD.note=note?note.value:'';
   var p=prod(PD.pid);
   addToCart(PD.pid,pdSelectedOpts(),PD.note,PD.qty);
   closeTop();refreshCart();refreshCatalog();
   toast(p.name+' ajouté à votre commande');break;}
 case 'update-line':{
   var note2=$('#pdNote');PD.note=note2?note2.value:'';
   var idx=-1;S.cart.forEach(function(l,i2){if(l.id===PD.lineId)idx=i2;});
   if(idx>=0){S.cart[idx].opts=pdSelectedOpts();S.cart[idx].note=PD.note;S.cart[idx].qty=PD.qty;}
   closeTop();
   if(S.route==='cart')render();else{refreshCart();refreshCatalog();}
   toast('Commande mise à jour');break;}
 case 'edit-line':{
   var l2=S.cart.filter(function(x){return x.id===id;})[0];
   if(l2)openProduct(l2.pid,l2.id);break;}
 case 'del-line':{
   S.cart=S.cart.filter(function(x){return x.id!==id;});
   toast('Plat retiré de votre commande');
   if(S.route==='cart')render();else{refreshCart();refreshCatalog();}break;}

 /* Quantité */
 case 'qty-up':
 case 'qty-down':{
   var d=(a==='qty-up')?1:-1;
   if(id==='pd'){
    PD.qty=Math.max(1,PD.qty+d);refreshProductSheet();bump($('[data-qval="pd"]'));
   }else if(id.indexOf('demo')===0){
    var v=t.parentNode.querySelector('.q-val');v.textContent=Math.max(1,(+v.textContent)+d);bump(v);
   }else{changeQty(id,d);}
   break;}

 /* Commande */
 case 'confirm-order':{
   var noteEl=$('#orderNote');if(noteEl)S.orderNote=noteEl.value;
   doConfirmOrder(t);break;}
 case 'retry-order':{closeTop();S.orderError=false;
   setTimeout(function(){doConfirmOrder(null);},120);break;}

 /* Réservation */
 case 'res-people':S.res.people=+t.getAttribute('data-n');render();break;
 case 'res-when':S.res.when=t.getAttribute('data-w');render();break;
 case 'res-date':S.res.date=t.getAttribute('data-d');render();break;
 case 'res-service':S.res.service=t.getAttribute('data-s');S.res.time=null;render();break;

   if(tm==='20:15'&&!slotTakenShown&&S.res.service==='soir'){slotTakenShown=true;slotJustTaken(tm);break;}
   S.res.time=tm;render();break;}
 case 'res-time-alt':S.res.time=t.getAttribute('data-t');closeTop();render();break;
 case 'res-pref':S.res.pref=t.getAttribute('data-p');render();break;
 case 'res-sms':S.res.sms=!S.res.sms;t.setAttribute('aria-checked',S.res.sms);break;

   break;

    S.lastRes=r;S.res=null;S.route='res-confirmed';render();
   },900);break;}
 case 'res-modify':{

 case 'res-cancel-confirmed':
